# ===============================
# Floci - Modelo de nube lcal
# ===============================
spring.application.name=inventario
server.port=${SERVER_PORT:8085}
server.tomcat.basedir=target/tomcat

# Conexión a Base de Datos mediante Variables de Entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bdtaller?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Endpoint de Nube Local (Floci)
cloud.endpoint=${CLOUD_ENDPOINT:http://localhost:4566}
cloud.region=${CLOUD_REGION:us-east-1}
floci.access-key=${AWS_ACCESS_KEY_ID:test}
floci.secret-key=${AWS_SECRET_ACCESS_KEY:test}

# Endpoints de salud y métricas
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


